# XGuard desktop client installers, built on GitHub-hosted runners and attached to the GitHub
# release under fixed, version-less names, so that
#   https://github.com/Sajjad-alaa/xguard-client/releases/latest/download/<name>
# always serves the newest client. XGuard Core links these names (Settings > Client downloads):
#   xguard-client_amd64.deb, xguard-client_arm64.deb   (Debian / Ubuntu 22.04+, glibc 2.35)
#   xguard-client.x86_64.rpm, xguard-client.aarch64.rpm
#   xguard-client_x64.msi                              (Windows, not code-signed)
#   xguard-client_universal.dmg                        (macOS, only with an Apple Developer account)
#
# Pushing a tag "v*" builds everything, creates the release as a draft, uploads the installers
# and publishes the release once Linux and Windows succeeded. A tag with a "-" (v2.3.0-rc1) is
# published as a pre-release, which "releases/latest" ignores.
#
# Run from the Actions tab (Release installers > Run workflow) or with
#   gh workflow run release-installers.yaml -f tag=v2.3.0
# With a tag the installers are uploaded to that release (replacing files of the same name);
# without one they are only attached to the run as artifacts.
#
# See docs/client-downloads.md in the XGuard docs for the whole release procedure.
name: Release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (for example v2.3.0); empty = build artifacts only"
        required: false
        type: string
        default: ""
      build_macos:
        description: "Also build the signed macOS dmg (needs the Apple signing secrets)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-installers-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  SQLX_OFFLINE: "1"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_version: ${{ steps.meta.outputs.build_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      upload: ${{ steps.meta.outputs.upload }}
      ref: ${{ steps.meta.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false

      - name: Work out tag and version
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${INPUT_TAG}"
          fi
          if [ -n "${TAG}" ]; then
            if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag ${TAG} is not of the form v1.2.3 or v1.2.3-rc1"
              exit 1
            fi
            BUILD_VERSION="${TAG#v}"
            UPLOAD=true
            REF="refs/tags/${TAG}"
          else
            BUILD_VERSION="$(jq -r .version src-tauri/tauri.conf.json 2>/dev/null || echo 0.0.0)-dev.${GITHUB_RUN_NUMBER}"
            UPLOAD=false
            REF="${GITHUB_SHA}"
          fi
          # Installers (MSI in particular) need a plain major.minor.patch package version.
          VERSION="${BUILD_VERSION%%-*}"
          if [[ "${BUILD_VERSION}" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "build_version=${BUILD_VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "upload=${UPLOAD}"
            echo "ref=${REF}"
          } >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG} version=${VERSION} build_version=${BUILD_VERSION} upload=${UPLOAD}"

      - name: Create the draft release
        if: steps.meta.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists; installers will be replaced."
          else
            FLAGS=(--draft --verify-tag --generate-notes --title "XGuard client ${TAG}")
            if [ "${PRERELEASE}" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "${TAG}" "${FLAGS[@]}"
          fi

  linux:
    name: Linux ${{ matrix.deb_arch }} (deb, rpm)
    needs: prepare
    # Built on Ubuntu 22.04 so the packages run on Ubuntu 22.04+ / Debian 12+ (glibc 2.35).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64
    env:
      XGUARD_CLIENT_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libudev-dev libxdo-dev \
            unzip rpm jq

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: new-ui/.nvmrc

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: new-ui/package.json
          run_install: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the UI
        working-directory: new-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The deb and rpm also ship the background service and the dg CLI.
      - name: Build the service and CLI
        working-directory: src-tauri
        run: cargo build --release -p xguard-client-service --bin xguard-service -p xguard-dg --bin dg

      - name: Build the deb and rpm
        working-directory: src-tauri
        run: |
          echo "{\"version\":\"${{ needs.prepare.outputs.version }}\"}" > release.conf.json
          cargo tauri build --ignore-version-mismatches --bundles deb,rpm --config release.conf.json

      - name: Name the packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#rpms[@]}" -ne 1 ]; then
            echo "::error::Expected one deb and one rpm, found: ${debs[*]} ${rpms[*]}"
            exit 1
          fi
          cp "${debs[0]}" "out/xguard-client_${{ matrix.deb_arch }}.deb"
          cp "${rpms[0]}" "out/xguard-client.${{ matrix.rpm_arch }}.rpm"
          (cd out && sha256sum * | tee SHA256SUMS-linux-${{ matrix.deb_arch }}.txt)
          dpkg-deb --info "out/xguard-client_${{ matrix.deb_arch }}.deb" | head -20

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xguard-client-linux-${{ matrix.deb_arch }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to the release
        if: needs.prepare.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/* --clobber

  windows:
    name: Windows x64 (msi)
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      XGUARD_CLIENT_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: new-ui/.nvmrc

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: new-ui/package.json
          run_install: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the UI
        working-directory: new-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The MSI bundles target/release/xguard-service.exe (resources-windows/fragments/service.wxs).
      - name: Build the service
        working-directory: src-tauri
        run: cargo build --release -p xguard-client-service --bin xguard-service

      # The upstream config signs every binary with a certificate this runner does not have:
      # drop the signing step and the certificate thumbprint. The MSI is not code-signed, so
      # Windows SmartScreen warns before installing it.
      - name: Build the MSI (unsigned)
        working-directory: src-tauri
        shell: bash
        run: |
          cat > release.conf.json <<EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "build": { "beforeBundleCommand": null },
            "bundle": { "windows": { "certificateThumbprint": null } }
          }
          EOF
          cargo tauri build --ignore-version-mismatches --bundles msi --config release.conf.json

      - name: Name the installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          msis=(src-tauri/target/release/bundle/msi/*.msi)
          if [ "${#msis[@]}" -ne 1 ]; then
            echo "::error::Expected one msi, found: ${msis[*]}"
            exit 1
          fi
          cp "${msis[0]}" out/xguard-client_x64.msi
          (cd out && sha256sum * | tee SHA256SUMS-windows-x64.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xguard-client-windows-x64
          path: out/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload to the release
        if: needs.prepare.outputs.upload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/* --clobber

  # The macOS client needs a VPN system extension, which macOS only loads when the app is signed
  # with a Developer ID certificate and a provisioning profile from an Apple Developer account
  # (paid membership). Without them this job is skipped, the release has no dmg, and Core's
  # "A macOS installer is published" setting should stay off.
  #
  # Runs when the workflow is started with build_macos, or on tags when the repository variable
  # XGUARD_MACOS_SIGNING is "true". Secrets:
  #   APPLE_CERTIFICATE           base64 of the Developer ID Application certificate (.p12)
  #   APPLE_CERTIFICATE_PASSWORD  its password
  #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Example Ltd (TEAMID)"
  #   APPLE_TEAM_ID               the 10-character team ID
  #   APPLE_PROVISIONING_PROFILE  base64 of the Developer ID provisioning profile for the
  #                               VPN system extension
  #   APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY_P8   App Store Connect API key, for
  #                               notarization (the .p8 content, not base64)
  macos:
    name: macOS universal (dmg)
    needs: prepare
    if: >-
      github.event.inputs.build_macos == 'true' ||
      (github.event_name == 'push' && vars.XGUARD_MACOS_SIGNING == 'true')
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      XGUARD_CLIENT_BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
    steps:
      - name: Check the signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_TEAM_ID APPLE_PROVISIONING_PROFILE APPLE_API_ISSUER APPLE_API_KEY_ID \
            APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::The macOS build needs an Apple Developer account. Missing secrets:${missing}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          submodules: recursive

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: new-ui/.nvmrc

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: new-ui/package.json
          run_install: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Import the signing certificate and provisioning profile
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${APPLE_CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security import "${RUNNER_TEMP}/certificate.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "${RUNNER_TEMP}/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          PROFILE="${RUNNER_TEMP}/xguard.provisionprofile"
          echo "${APPLE_PROVISIONING_PROFILE}" | base64 --decode > "${PROFILE}"
          mkdir -p "${HOME}/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE}" "${HOME}/Library/MobileDevice/Provisioning Profiles/"
          echo "PROVISIONING_PROFILE_PATH=${PROFILE}" >> "${GITHUB_ENV}"
          KEY="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "${APPLE_API_KEY_P8}" > "${KEY}"
          echo "APPLE_API_KEY_PATH=${KEY}" >> "${GITHUB_ENV}"

      - name: Set build number
        run: |
          sed -i '' "s,@BUILD_NUMBER@,${{ github.run_number }}," swift/extension/VPNExtension.xcodeproj/project.pbxproj
          sed -i '' "s,@BUILD_NUMBER@,${{ github.run_number }}," src-tauri/tauri.macos.conf.json

      - name: Build the UI
        working-directory: new-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # tauri.dmg.conf.json builds the VPN system extension (swift/build.sh) and embeds the
      # provisioning profile; point it at the profile imported above.
      - name: Build the dmg
        working-directory: src-tauri
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          cat > release.conf.json <<EOF
          {
            "version": "${{ needs.prepare.outputs.version }}",
            "bundle": { "macOS": { "files": {
              "embedded.provisionprofile": "${PROVISIONING_PROFILE_PATH}",
              "Library/SystemExtensions/local.xguard.VPNExtension.systemextension": "../swift/extension/build/Installer/VPNSystemExtension.systemextension"
            } } }
          }
          EOF
          cargo tauri build --ignore-version-mismatches --config tauri.dmg.conf.json \
            --config release.conf.json --target universal-apple-darwin

      - name: Name the installer
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one dmg, found: ${dmgs[*]}"
            exit 1
          fi
          cp "${dmgs[0]}" out/xguard-client_universal.dmg
          (cd out && shasum -a 256 * | tee SHA256SUMS-macos-universal.txt)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xguard-client-macos-universal
          path: out/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload to the release
        if: needs.prepare.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/* --clobber

  publish:
    name: Publish release
    needs: [prepare, linux, windows, macos]
    # Publish once Linux and Windows are uploaded; macOS is optional (skipped without signing).
    if: >-
      always() && needs.prepare.outputs.upload == 'true' &&
      needs.linux.result == 'success' && needs.windows.result == 'success' &&
      (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "${PRERELEASE}" = "true" ]; then
            gh release edit "${TAG}" --draft=false --prerelease
          else
            gh release edit "${TAG}" --draft=false --latest
          fi
          gh release view "${TAG}" --json url,assets --jq '.url, (.assets[].name)'
