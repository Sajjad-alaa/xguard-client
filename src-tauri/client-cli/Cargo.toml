[package]
name = "xguard-cli"
description = "Command-line client for XGuard VPN - connect, disconnect, status"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license-file = "../../LICENSE.md"
rust-version.workspace = true
version.workspace = true

[dependencies]
base64.workspace = true
chrono.workspace = true
clap.workspace = true
common = { package = "xguard-client-common", path = "../common" }
xguard_client_proto = { package = "xguard-client-proto", path = "../client-proto" }
xguard_core = { package = "xguard-client-core", path = "../core" }
image.workspace = true
owo-colors.workspace = true
qrcode.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing.workspace = true
url.workspace = true
webbrowser.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
