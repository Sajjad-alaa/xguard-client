[package]
name = "xguard-client-service"
description = "XGuard client daemon service"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license-file.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
xguard-client-common = { path = "../common" }
xguard-client-proto = { path = "../client-proto" }
xguard_wireguard_rs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
async-stream.workspace = true
futures-core.workspace = true
windows-core.workspace = true
windows-service.workspace = true
windows-sys = { workspace = true, features = ["Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "xguard-service"
path = "src/bin/xguard-service.rs"
